# Settings the Supabase CLI uses when deploying Edge Functions
# (npx supabase functions deploy ...). No secrets in here.
project_id = "nexgain-team"

# Customers open the quote page without logging in; the secret code is checked instead.
[functions.quote-page]
verify_jwt = false

# Google / Microsoft send the browser here after login, without a NexGain login;
# the one-time state code is checked instead.
[functions.oauth-callback]
verify_jwt = false

# Basiq sends the browser here after the bank login, without a NexGain login;
# the one-time state code is checked instead.
[functions.bank-callback]
verify_jwt = false

# Called by the reminders timer (pg_cron), which has no NexGain login; the
# REMINDERS_CRON_SECRET password (or, for a test, the owner's login) is checked instead.
[functions.send-reminders]
verify_jwt = false

# These need the owner's NexGain login.
[functions.oauth-start]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.oauth-disconnect]
verify_jwt = true

[functions.integration-data]
verify_jwt = true

[functions.bank-connect]
verify_jwt = true

[functions.bank-sync]
verify_jwt = true

[functions.bank-disconnect]
verify_jwt = true

[functions.read-receipt]
verify_jwt = true
